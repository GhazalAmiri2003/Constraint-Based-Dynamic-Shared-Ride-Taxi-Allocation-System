{% extends "base.html" %}

{% block title %}
    Login | Dynamic Taxi
{% endblock %}


{% block content %}

<div class="card">

    <h1 class="card-title">
        Login
    </h1>

    <p class="text-muted">
        Sign in to your account.
    </p>


    <form method="post">

        {% csrf_token %}


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                class="form-control"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                class="form-control"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Login
        </button>

    </form>


    <p class="mt-20">

        Don't have an account?

        <a href="/register/">
            Register
        </a>

    </p>

</div>

{% endblock %}
